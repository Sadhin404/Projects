plugins { id 'com.android.application' }
android {
    namespace 'com.shadhinkhan.grabit'
    compileSdk 34
    defaultConfig {
        applicationId "com.shadhinkhan.grabit"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources { excludes += ['META-INF/*'] } }
}
dependencies {
    implementation 'com.github.yausername.youtubedl-android:library:0.18.1'
    implementation 'com.github.yausername.youtubedl-android:ffmpeg:0.18.1'
}
